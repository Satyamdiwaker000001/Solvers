<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="solversGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#4338CA" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Modern Rounded Squircle Container -->
  <rect width="64" height="64" rx="16" fill="url(#solversGrad)" filter="url(#shadow)" />

  <!-- Inner Subtle Accent Border -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />

  <!-- Code Bracket Left < -->
  <path d="M22 22 L13 32 L22 42" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Code Bracket Right > -->
  <path d="M42 22 L51 32 L42 42" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Core Diamond / Spark Accent Node in Center -->
  <polygon points="32,24 37.5,32 32,40 26.5,32" fill="#38BDF8" />

  <!-- Central Glow / Micro Dot -->
  <circle cx="32" cy="32" r="2.2" fill="#FFFFFF" />
</svg>